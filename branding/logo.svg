<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6B05A"/>
      <stop offset=".5" stop-color="#8E8A86"/>
      <stop offset="1" stop-color="#2878DE"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D8BF2"/>
      <stop offset="1" stop-color="#1A4FB5"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="512" cy="572" r="232"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B2A66" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- fond NounoursCorp -->
  <rect x="40" y="40" width="944" height="944" rx="215" fill="url(#bg)"/>
  <path d="M40 340 Q512 620 984 340 L984 255 Q984 40 769 40 L255 40 Q40 40 40 255 Z" fill="#fff" opacity=".14"/>
  <!-- tête d'ours -->
  <g filter="url(#sh)" fill="#fff">
    <circle cx="322" cy="262" r="118"/>
    <circle cx="702" cy="262" r="118"/>
    <circle cx="512" cy="566" r="300"/>
  </g>
  <circle cx="322" cy="262" r="58" fill="#F6B05A" opacity=".55"/>
  <circle cx="702" cy="262" r="58" fill="#F6B05A" opacity=".55"/>
  <!-- globe Internet -->
  <circle cx="512" cy="572" r="232" fill="url(#gl)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" opacity=".95">
    <ellipse cx="512" cy="572" rx="96" ry="232"/>
    <ellipse cx="512" cy="572" rx="184" ry="232" opacity=".55"/>
    <line x1="512" y1="330" x2="512" y2="814"/>
    <line x1="270" y1="572" x2="754" y2="572"/>
    <path d="M296 452 Q512 500 728 452"/>
    <path d="M296 692 Q512 644 728 692"/>
  </g>
  <circle cx="512" cy="572" r="232" fill="none" stroke="#fff" stroke-width="14" opacity=".35"/>
  <!-- reflet -->
  <ellipse cx="430" cy="440" rx="90" ry="46" fill="#fff" opacity=".18" transform="rotate(-28 430 440)"/>
</svg>
