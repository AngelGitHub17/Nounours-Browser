// NounoursBrowser — configuration privilégiée du moteur (autoconfig). La 1re ligne doit rester un commentaire.
// Ajoute une section « NounoursBrowser » dans les Paramètres : Réglages Nounours + Revoir le démarrage rapide.
// Valeurs par défaut NounoursBrowser (l'utilisateur peut les changer ; contrairement à user.js, elles ne sont pas réimposées)
try {
  defaultPref("browser.toolbars.bookmarks.visibility", "always");   // barre des favoris visible
  // Migration unique : les versions 1.1 / 1.2 imposaient « never » (barre masquée), resté dans le profil
  var Sp = (globalThis.Services || ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services).prefs;
  if (!Sp.getBoolPref("nounours.migration.bookmarksbar", false)) {
    Sp.clearUserPref("browser.toolbars.bookmarks.visibility");
    Sp.setBoolPref("nounours.migration.bookmarksbar", true);
  }
} catch (e) {}

// ---------------------------------------------------------------------------------------------
// Profil NounoursBrowser
//  - Windows / Linux : NounoursBrowser.exe / nounours-browser préparent le profil et lancent le moteur
//    avec « -profile ». Si le moteur est lancé directement (fenêtre épinglée…), on relance le lanceur.
//  - macOS : le moteur EST l'exécutable principal de NounoursBrowser.app (macOS ne permet pas de lui
//    passer d'arguments, et un script placé à côté de lui l'empêche de démarrer). Il prépare donc
//    lui-même le profil (fichiers dans Contents/Resources/nounours) puis, si besoin, se relance dessus.
// ---------------------------------------------------------------------------------------------
try {
  (function () {
    var S = globalThis.Services || ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
    var os = S.appinfo.OS;
    var env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
    if (env.exists("NB_ALLOW_OTHER_PROFILE")) return;
    function child(dir) { var f = dir.clone(); for (var i = 1; i < arguments.length; i++) f.append(arguments[i]); return f; }
    function readText(f) { return Components.utils.readUTF8File(f); }
    function writeText(f, text) {
      if (f.exists()) { try { if (readText(f) === text) return; } catch (e) {} }
      var tmp = f.parent.clone(); tmp.append(f.leafName + ".nbtmp");
      var o = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
      o.init(tmp, 0x02 | 0x08 | 0x20, 0o644, 0);
      var c = Cc["@mozilla.org/intl/converter-output-stream;1"].createInstance(Ci.nsIConverterOutputStream);
      c.init(o, "UTF-8"); c.writeString(text); c.close();
      tmp.moveTo(null, f.leafName);
    }
    function put(src, dir, name) {        // copie seulement si différent, remplacement atomique
      var dst = child(dir, name);
      if (dst.exists() && dst.fileSize === src.fileSize && dst.lastModifiedTime === src.lastModifiedTime) return;
      var tmpName = name + ".nbtmp";
      var tmp = child(dir, tmpName); if (tmp.exists()) tmp.remove(false);
      src.copyTo(dir, tmpName);
      child(dir, tmpName).moveTo(null, name);
    }

    var prof = S.dirsvc.get("ProfD", Ci.nsIFile);
    var isOurs = /[\/\\](nounoursbrowser|nounours-browser)[\/\\]profile$/i.test(prof.path);

    if (os === "Darwin") {
      var payload = child(S.dirsvc.get("GreD", Ci.nsIFile), "nounours");
      if (!payload.exists()) return;
      var data = child(S.dirsvc.get("Home", Ci.nsIFile), "Library", "Application Support", "NounoursBrowser");
      var target = child(data, "profile");
      ["extensions", "chrome"].forEach(function (d) { var x = child(target, d); if (!x.exists()) x.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755); });
      var tpl = child(payload, "profile-template");
      var overrides = child(data, "user-overrides.js");
      if (!overrides.exists()) child(tpl, "user-overrides.js").copyTo(data, "user-overrides.js");
      var mode = "balanced";
      try { mode = readText(child(data, "mode.txt")).trim(); } catch (e) {}
      var userjs = readText(child(tpl, "user.js"));
      if (mode === "eco") userjs += "\n" + readText(child(tpl, "user-eco.js"));
      userjs += "\n" + readText(overrides);
      writeText(child(target, "user.js"), userjs);
      var css = child(tpl, "chrome").directoryEntries;
      while (css.hasMoreElements()) { var f = css.nextFile; put(f, child(target, "chrome"), f.leafName); }
      put(child(payload, "nounours-browser.xpi"), child(target, "extensions"), "nounours-browser@didikaria.fr.xpi");
      // Ancienne appli « Nounours Browser.app » (avec espace, ≤ 1.1) : retirée si c'est bien la nôtre
      [child(S.dirsvc.get("Home", Ci.nsIFile), "Applications", "Nounours Browser.app"),
       Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile)].forEach(function (old, i) {
        try {
          if (i === 1) old.initWithPath("/Applications/Nounours Browser.app");
          var pl = child(old, "Contents", "Info.plist");
          if (old.exists() && pl.exists() && readText(pl).indexOf("fr.nounourscorp.browser") >= 0) old.remove(true);
        } catch (e) {}
      });
      if (isOurs) return;
      // Démarré sur un autre profil : on se relance sur celui de NounoursBrowser
      var exe = S.dirsvc.get("XREExeF", Ci.nsIFile);
      S.obs.addObserver(function () {
        try {
          var p = Cc["@mozilla.org/process/util;1"].createInstance(Ci.nsIProcess);
          p.init(exe);
          p.runw(false, ["-profile", target.path], 2);
        } catch (e) { Components.utils.reportError(e); }
        S.startup.quit(Ci.nsIAppStartup.eForceQuit);
      }, "final-ui-startup");
      return;
    }

    if (isOurs) return;
    var exe2 = S.dirsvc.get("XREExeF", Ci.nsIFile);
    var cands = os === "WINNT" ? [child(exe2.parent.parent, "NounoursBrowser.exe")]
                               : [child(exe2.parent.parent, "nounours-browser"), child(exe2.parent.parent, "AppRun")];
    var launcher = null;
    for (var i = 0; i < cands.length; i++) if (cands[i].exists()) { launcher = cands[i]; break; }
    if (!launcher) return;
    S.obs.addObserver(function () {
      try {
        var proc = Cc["@mozilla.org/process/util;1"].createInstance(Ci.nsIProcess);
        proc.init(launcher);
        proc.runw(false, [], 0);
      } catch (e) { Components.utils.reportError(e); }
      S.startup.quit(Ci.nsIAppStartup.eForceQuit);
    }, "final-ui-startup");
  })();
} catch (e) {
  Components.utils.reportError("NounoursBrowser (profil) : " + e);
}

// Windows : les fenêtres portent l'identifiant du raccourci NounoursBrowser (AppUserModelID).
// Épingler une fenêtre ouverte épingle donc NounoursBrowser, pas le moteur seul.
try {
  (function () {
    var S = globalThis.Services || ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
    if (S.appinfo.OS !== "WINNT") return;
    var AUMID = "NounoursCorp.NounoursBrowser";
    S.obs.addObserver(function (win) {
      try {
        Cc["@mozilla.org/windows-taskbar;1"].getService(Ci.nsIWinTaskbar).setGroupIdForWindow(win, AUMID);
      } catch (e) { Components.utils.reportError(e); }
    }, "browser-delayed-startup-finished");
  })();
} catch (e) {}

try {
  (function () {
    var EXT = "moz-extension://6e0b7d1a-4b1f-4c55-9a3e-d1d1ca71a2a0/";
    var LOGO = EXT + "icons/icon.svg";
    var Svc = globalThis.Services || ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;

    function open(win, path) {
      var top = win.browsingContext.topChromeWindow;
      top.openTrustedLinkIn(EXT + path, "tab");
    }

    function button(doc, label, primary, onClick) {
      var b = doc.createElement("moz-button");
      b.setAttribute("label", label);
      if (primary) b.setAttribute("type", "primary");
      b.addEventListener("click", onClick);
      return b;
    }

    function inject(doc) {
      var win = doc.defaultView;
      if (doc.getElementById("nounours-section")) return;
      var main = doc.getElementById("mainPrefPane");
      if (!main) return;

      // « Votre navigateur est géré par votre organisation » : ce sont simplement les réglages de NounoursBrowser
      var st = doc.createElementNS("http://www.w3.org/1999/xhtml", "style");
      st.textContent = "#policies-container-content, #policies-container, setting-group[groupid=\"accountDisabled\"] { display: none !important; }";
      (doc.head || doc.documentElement).append(st);

      // Carte en haut de « Général »
      var card = doc.createElement("div");
      card.id = "nounours-section";
      card.setAttribute("data-category", "paneGeneral");
      card.style.cssText = "display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:16px;row-gap:14px;padding:18px 20px;margin:0 0 24px;border-radius:12px;" +
        "background:color-mix(in srgb, currentColor 5%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb, currentColor 10%, transparent)";
      var img = doc.createElement("img");
      img.src = LOGO; img.width = 52; img.height = 52; img.alt = "";
      var txt = doc.createElement("div");
      txt.style.cssText = "flex:1;min-width:0";
      var h = doc.createElement("h2");
      h.textContent = "NounoursBrowser";
      h.style.cssText = "margin:0 0 2px;font-size:1.3em";
      var p = doc.createElement("div");
      p.textContent = "Thème, économie de mémoire, page d'accueil… et la présentation du navigateur.";
      p.style.cssText = "opacity:.75";
      txt.append(h, p);
      var actions = doc.createElement("div");
      actions.style.cssText = "grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end";
      actions.append(
        button(doc, "Revoir le démarrage rapide", false, function () { open(win, "onboarding/index.html"); }),
        button(doc, "Réglages Nounours", true, function () { open(win, "settings/index.html"); })
      );
      card.append(img, txt, actions);
      main.prepend(card);

      // Entrée dans la liste des catégories (ouvre les Réglages Nounours)
      var nav = doc.getElementById("categories");
      if (nav && !doc.getElementById("category-nounours")) {
        var item = doc.createElement("moz-page-nav-button");
        item.id = "category-nounours";
        item.setAttribute("iconsrc", LOGO);
        item.textContent = "NounoursBrowser";
        item.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation();
          open(win, "settings/index.html");
        }, true);
        var general = doc.getElementById("category-general");
        if (general && general.nextSibling) nav.insertBefore(item, general.nextSibling); else nav.prepend(item);
      }
    }

    Svc.obs.addObserver(function (doc) {
      try {
        var href = doc && doc.location && doc.location.href;
        if (!href || !/^about:(preferences|settings)/.test(href)) return;
        doc.defaultView.addEventListener("DOMContentLoaded", function () {
          // les panneaux sont construits juste après le chargement
          doc.defaultView.setTimeout(function () { inject(doc); }, 0);
        }, { once: true });
      } catch (e) { Components.utils.reportError(e); }
    }, "document-element-inserted");
  })();
} catch (e) {
  Components.utils.reportError("NounoursBrowser autoconfig : " + e);
}
