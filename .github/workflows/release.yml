# Publie automatiquement une version de Nounours Browser.
#
# 1. scripts/set-version.sh X.Y.Z  +  section « ## X.Y.Z » dans CHANGELOG.md
# 2. git commit + git push sur main
# → si la release vX.Y.Z n'existe pas encore :
#     Linux   : AppImage, .deb, zip portable          (ubuntu)
#     Windows : NounoursBrowser.exe, setup.exe, zip   (windows)
#     macOS   : .dmg, zip (.app)                      (macos)
#   puis release GitHub + inscription dans le catalogue NounoursLauncher.
#
# Réglages du dépôt (Settings → Secrets and variables → Actions) :
#   Secret   NL_CI_TOKEN : jeton CI du panel NounoursLauncher (⚙ Réglages → Générer un jeton CI)
#   Variable NL_API_URL  : https://nounourscorp.fr/launcher/api.php (valeur par défaut)
#   Variable NL_SLUG     : nounours-browser (valeur par défaut)

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r '.version_name // .version' extension/manifest.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "v$v existe déjà : rien à publier."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Nouvelle version : v$v"
          fi

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier l'extension (web-ext lint)
        run: npx -y web-ext lint --source-dir extension --self-hosted
      - name: Outils
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Construire (AppImage, .deb, zips) et préparer macOS / Windows
        env:
          APPIMAGETOOL_ARGS: --appimage-extract-and-run
        run: |
          tools/package.sh
          tar -C build -cf build/stages.tar stage-mac stage-win
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: stages
          path: build/stages.tar

  windows:
    needs: [check, linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stages
          path: build
      - name: Compiler NounoursBrowser.exe, puis zip portable et setup.exe
        shell: pwsh
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          tar -xf build\stages.tar -C build
          $n = ($env:V -replace '^(\d+\.\d+\.\d+).*$', '$1') + '.0'
          $cs = 'launchers\windows\NounoursBrowser.cs'
          (Get-Content -Raw -Encoding UTF8 $cs).Replace('"0.0.0.0"', "`"$n`"").Replace('"0.0.0-dev"', "`"$env:V`"") |
            Set-Content -Encoding UTF8 $cs
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /codepage:65001 /target:winexe /optimize+ /win32icon:branding\logo.ico `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /out:build\stage-win\NounoursBrowser.exe launchers\windows\NounoursBrowser.cs
          if ($LASTEXITCODE -ne 0) { throw "Compilation C# échouée" }

          New-Item -ItemType Directory -Force build\release | Out-Null
          Push-Location build\stage-win
          7z a -tzip "..\release\NounoursBrowser-$env:V-win-x64.zip" * | Out-Null
          Pop-Location

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:V" "/DStageDir=$((Resolve-Path build\stage-win).Path)" installers\windows\NounoursBrowser.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }
          Get-ChildItem build\release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/release/*

  macos:
    needs: [check, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stages
          path: build
      - name: Créer le .dmg
        run: |
          tar -xf build/stages.tar -C build
          installers/macos/make-dmg.sh "${{ needs.check.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/release/*.dmg

  release:
    needs: [check, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: |
          rm -f dl/stages.tar
          ls -la dl
          scripts/changelog-section.sh "$V" > notes.md
          [ -s notes.md ] || echo "Version $V" > notes.md
          pre=""; case "$V" in *-*) pre="--prerelease" ;; esac
          gh release create "v$V" dl/* --title "Nounours Browser $V" --notes-file notes.md --target "$GITHUB_SHA" $pre
      - name: Inscrire dans le catalogue NounoursLauncher
        env:
          GH_TOKEN: ${{ github.token }}
          NL_CI_TOKEN: ${{ secrets.NL_CI_TOKEN }}
          NL_API_URL: ${{ vars.NL_API_URL || 'https://nounourscorp.fr/launcher/api.php' }}
          NL_SLUG: ${{ vars.NL_SLUG || 'nounours-browser' }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          if [ -z "$NL_CI_TOKEN" ]; then
            echo "::warning title=Catalogue::Secret NL_CI_TOKEN absent : release créée mais pas inscrite dans NounoursLauncher."
            exit 0
          fi
          NOTES="$(cat notes.md)" scripts/publish-catalog.sh
