# Diagnostic macOS : installe la release comme NounoursLauncher, lance l'appli, collecte journaux et captures.
# Déclenché par un push sur la branche « diag/run » ; résultats poussés sur la branche « diag/results ».
name: Diagnostic macOS

on:
  push:
    branches: ["diag/run"]

permissions:
  contents: write

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'appli comme la release, l'installer comme NounoursLauncher, la lancer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p out; sw_vers > out/info.txt
          ESR=$(cat engine/ESR_VERSION)
          curl -fsSL -o ff.dmg "https://archive.mozilla.org/pub/firefox/releases/$ESR/mac/fr/Firefox%20$ESR.dmg"
          mnt=$(hdiutil attach -nobrowse -readonly -noautoopen ff.dmg | tail -1 | awk -F'\t' '{print $NF}')
          ditto "$(ls -d "$mnt"/*.app | head -1)" eng/Firefox.app; ditto "$(ls -d "$mnt"/*.app | head -1)" /tmp/RealFirefox.app; hdiutil detach -quiet "$mnt"
          tools/package.sh > out/package.txt 2>&1
          installers/macos/build-app.sh eng/Firefox.app build/app "$(jq -r '.version_name // .version' extension/manifest.json)-diag" > out/build.txt 2>&1
          echo "build exit=$?" >> out/build.txt
          m2=/tmp/nbm; mkdir -p $m2; hdiutil attach -nobrowse -readonly -mountpoint $m2 build/release/*.dmg >/dev/null
          APP=~/Applications/NounoursBrowser.app; mkdir -p ~/Applications
          ditto "$(ls -d $m2/*.app | head -1)" "$APP"; hdiutil detach -quiet $m2
          ls -la "$APP/Contents/MacOS" | head -30 > out/macos-dir.txt
          { plutil -p "$APP/Contents/Info.plist" | grep -i "icon\|name\|identifier"; ls "$APP/Contents/Resources" | grep -i "icns\|car"; } > out/icon.txt

          echo "== 1) open -a (premier lancement)" > out/run.txt
          open -a "$APP"; sleep 35
          ps axo pid,etime,command | grep -i "[N]ounoursBrowser.app/Contents/MacOS/firefox" | grep -v contentproc | cut -c1-220 >> out/run.txt
          screencapture -x out/1-premier-lancement.png
          screencapture -x -R 800,700,224,68 out/1-dock.png
          echo "== 2) second open -a (déjà ouvert)" >> out/run.txt
          open -a "$APP"; sleep 8
          ps axo pid,etime,command | grep -i "[N]ounoursBrowser.app/Contents/MacOS/firefox" | grep -v contentproc | cut -c1-220 >> out/run.txt
          osascript -e 'tell application id "fr.nounourscorp.browser" to quit' ; sleep 6; pkill -f NounoursBrowser.app; sleep 2

          echo "== 3) avec un vrai Firefox ouvert" >> out/run.txt
          open -a /tmp/RealFirefox.app; sleep 15
          open -a "$APP"; sleep 30
          ps axo pid,etime,command | grep -i "[F]irefox.app/Contents/MacOS/firefox\|[N]ounoursBrowser.app/Contents/MacOS/firefox" | grep -v contentproc | cut -c1-220 >> out/run.txt
          screencapture -x out/3-avec-firefox.png
          pkill -f NounoursBrowser.app; pkill -f RealFirefox.app; sleep 2

          { echo "== données"; ls -la ~/Library/Application\ Support/NounoursBrowser 2>&1;
            ls ~/Library/Application\ Support/NounoursBrowser/profile 2>&1 | head -60;
            echo "== extensions.json"; grep -o '"id":"[^"]*","syncGUID[^}]*"active":[a-z]*' ~/Library/Application\ Support/NounoursBrowser/profile/extensions.json 2>/dev/null | cut -c1-120 | head;
            echo "== profils Firefox"; cat ~/Library/Application\ Support/Firefox/profiles.ini 2>&1; } > out/data.txt 2>&1
          cat out/run.txt
      - name: Publier les résultats (branche diag/results)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diag-results-tmp
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name out ! -name .git -exec rm -rf {} +
          git add out && git commit -qm "Diagnostic macOS $(date -u +%FT%TZ)"
          git push -f origin HEAD:refs/heads/diag/results
