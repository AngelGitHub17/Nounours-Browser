# Diagnostic macOS : installe la release comme NounoursLauncher, lance l'appli, collecte journaux et captures.
# Déclenché par un push sur la branche « diag/run » ; résultats poussés sur la branche « diag/results ».
name: Diagnostic macOS

on:
  push:
    branches: ["diag/run"]

permissions:
  contents: write

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Variantes de signature (test headless du moteur)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p out; sw_vers > out/info.txt
          ESR=$(cat engine/ESR_VERSION)
          curl -fsSL -o ff.dmg "https://archive.mozilla.org/pub/firefox/releases/$ESR/mac/fr/Firefox%20$ESR.dmg"
          mnt=$(hdiutil attach -nobrowse -readonly -noautoopen ff.dmg | tail -1 | awk -F'\t' '{print $NF}')
          ditto "$(ls -d "$mnt"/*.app | head -1)" orig.app; hdiutil detach -quiet "$mnt"
          codesign -d --entitlements :- orig.app/Contents/MacOS/firefox > out/entitlements-firefox.plist 2>&1
          codesign -d --entitlements :- orig.app/Contents/MacOS/plugin-container.app > out/entitlements-plugin.plist 2>&1
          codesign -dvv orig.app/Contents/MacOS/firefox > out/orig-sig.txt 2>&1
          test_app() { # test_app <nom> <app>
            rm -rf /tmp/p_$1; mkdir -p /tmp/p_$1
            timeout 90 "$2/Contents/MacOS/firefox" --headless -no-remote -profile /tmp/p_$1 --screenshot /tmp/s_$1.png about:blank > out/run-$1.txt 2>&1
            echo "exit=$? screenshot=$(test -s /tmp/s_$1.png && echo OUI || echo non)" >> out/run-$1.txt
            echo "$1 : $(tail -1 out/run-$1.txt)  $(grep -m1 -i 'xpcom' out/run-$1.txt)" >> out/summary.txt
          }
          test_app 1-original orig.app

          ditto orig.app v2.app; codesign --force --deep -s - v2.app 2>/dev/null
          test_app 2-adhoc-deep v2.app

          # 3 : ad hoc + hardened runtime + entitlements d'origine (firefox et sous-applis)
          ditto orig.app v3.app
          codesign -d --entitlements v3-ent.plist --xml orig.app/Contents/MacOS/firefox 2>/dev/null
          codesign -d --entitlements v3-ent-pc.plist --xml orig.app/Contents/MacOS/plugin-container.app 2>/dev/null
          find v3.app/Contents -name "*.dylib" -o -name "XUL" | while read f; do codesign --force -s - "$f"; done
          for h in v3.app/Contents/MacOS/*.app v3.app/Contents/Frameworks/*.framework; do codesign --force --deep -s - --options runtime --entitlements v3-ent-pc.plist "$h"; done
          codesign --force -s - --options runtime --entitlements v3-ent.plist v3.app/Contents/MacOS/firefox
          codesign --force -s - --options runtime --entitlements v3-ent.plist v3.app
          test_app 3-adhoc-runtime-ent v3.app

          # 4 : ad hoc, entitlement « disable-library-validation » ajouté
          ditto orig.app v4.app
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.disable-library-validation bool true" v3-ent.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.disable-library-validation bool true" v3-ent-pc.plist 2>/dev/null
          find v4.app/Contents -name "*.dylib" -o -name "XUL" | while read f; do codesign --force -s - "$f"; done
          for h in v4.app/Contents/MacOS/*.app v4.app/Contents/Frameworks/*.framework; do codesign --force --deep -s - --entitlements v3-ent-pc.plist "$h"; done
          codesign --force -s - --entitlements v3-ent.plist v4.app/Contents/MacOS/firefox
          codesign --force -s - --entitlements v3-ent.plist v4.app
          test_app 4-adhoc-dlv v4.app

          # 5 : signatures Mozilla conservées ; seul le bundle externe (Info.plist modifié) re-signé, sans --deep
          ditto orig.app v5.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleName NounoursBrowser" v5.app/Contents/Info.plist
          codesign --force -s - --preserve-metadata=entitlements v5.app/Contents/MacOS/firefox
          test_app 5-mozilla-libs-firefox-adhoc v5.app

          # 6 : rien re-signé, seulement des ressources modifiées (omni.ja) + Info.plist
          ditto orig.app v6.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleName NounoursBrowser" v6.app/Contents/Info.plist
          echo "// test" >> v6.app/Contents/Resources/defaults/pref/channel-prefs.js
          test_app 6-sans-resignature v6.app

          # 7 : Info.plist d'origine, ressources modifiées, aucune re-signature
          ditto orig.app v7.app
          echo "// test" >> v7.app/Contents/Resources/defaults/pref/channel-prefs.js
          test_app 7-ressources-seules v7.app
          cat out/summary.txt
      - name: Publier les résultats (branche diag/results)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diag-results-tmp
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name out ! -name .git -exec rm -rf {} +
          git add out && git commit -qm "Diagnostic macOS $(date -u +%FT%TZ)"
          git push -f origin HEAD:refs/heads/diag/results
